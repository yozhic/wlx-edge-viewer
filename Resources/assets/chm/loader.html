<!DOCTYPE html>
<!--
  CHM view. Served at evh://chm.example/?evchm=<id>; the archive entries are
  evh://chm.example/<path> (same origin). ChmProcessor fills the placeholders
  __CHM_TITLE__, __CHM_START__, __CHM_HOME__, __CHM_TOC__, __CHM_NAVCLOSED__,
  __CHM_DARK__, __CHM_CODEPAGE__ and __CHM_CSS__ ([CHM] CSS / CSSDark).
-->
<html class="ev-chm-loader">
<head>
<meta charset="utf-8">
<title>__CHM_TITLE__</title>
<!-- Built-in look. :where() keeps every rule at zero specificity, so any
     rule of the [CHM] stylesheet below wins. -->
<style id="ev-chm-builtin">
:where(html, body) { margin: 0; height: 100%; }
:where(body) { display: flex; font: 13px system-ui, sans-serif; background: #fff; color: #222; }
:where(html.ev-dark) { color-scheme: dark; scrollbar-color: #5a5a5a #1e1e1e; }
:where(html.ev-dark body) { background: #1e1e1e; color: #ddd; }
:where(.ev-chm-side) { width: 280px; min-width: 120px; box-sizing: border-box; overflow: hidden;
	display: flex; flex-direction: column; border-right: 1px solid rgba(128, 128, 128, 0.35); }
/* Buttons above the table of contents: Home, Back, Forward, Hide. */
:where(.ev-chm-toolbar) { flex: none; display: flex; align-items: center; gap: 2px; padding: 4px 6px;
	border-bottom: 1px solid rgba(128, 128, 128, 0.35); }
:where(.ev-chm-btn) { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 26px;
	padding: 0; border: 1px solid transparent; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
:where(.ev-chm-btn:hover:not(:disabled)) { background: rgba(128, 128, 128, 0.2); }
:where(.ev-chm-btn:disabled) { opacity: 0.35; cursor: default; }
:where(.ev-chm-btn svg) { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6;
	stroke-linecap: round; stroke-linejoin: round; }
:where(.ev-chm-btn-collapse) { margin-left: auto; }
/* The Home icon stands right above the funnel icon of the filter field
   (both centred 15 px from the left edge: 6 px toolbar padding - 5 px + 28/2). */
:where(.ev-chm-btn-home) { margin-left: -5px; }
:where(.ev-chm-toc), :where(.ev-chm-results) { flex: 1; overflow: auto; padding: 6px 8px; }
/* An empty line after the last entry: End / PgDn at the end of a long list
   leave the last entry above the WebView2 link tooltip (bottom left). */
:where(.ev-chm-toc)::after { content: ''; display: block; height: calc(1.2em + 6px); }
/* Filter of the contents (fuzzy): the field under the buttons; while it has
   text, a ranked list of matches (.ev-chm-results) replaces the tree. */
:where(.ev-chm-filter) { flex: none; position: relative; border-bottom: 1px solid rgba(128, 128, 128, 0.35); }
/* Funnel icon at the left of the field (instead of a placeholder text). */
:where(.ev-chm-filter-icon) { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); display: flex;
	pointer-events: none; opacity: 0.6; }
:where(.ev-chm-filter-icon svg) { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4;
	stroke-linejoin: round; stroke-linecap: round; }
/* A full-width row like the buttons above: no frame, no outer margin, square
   corners; the focus shows as another background, not as a frame. */
:where(.ev-chm-filter-input) { display: block; width: 100%; box-sizing: border-box; height: 28px; margin: 0; padding: 0 8px 0 28px;
	font: inherit; color: inherit; background: transparent; border: 0; border-radius: 0; outline: none; }
:where(.ev-chm-filter-input:focus), :where(.ev-chm-filter-input:focus-visible) { background: rgba(128, 128, 128, 0.16); outline: none; }
:where(.ev-chm-results) { display: none; }
:where(html.ev-chm-filtering .ev-chm-results) { display: block; }
:where(html.ev-chm-filtering .ev-chm-toc) { display: none; }
:where(.ev-chm-result) { display: block; padding: 3px 4px; border-radius: 3px; color: inherit; text-decoration: none; }
:where(.ev-chm-result-name) { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:where(.ev-chm-result-path) { display: block; font-size: 11px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:where(.ev-chm-result:hover) { background: rgba(128, 128, 128, 0.15); }
:where(.ev-chm-result-active) { background: rgba(11, 87, 208, 0.12); }
:where(html.ev-dark .ev-chm-result-active) { background: rgba(138, 180, 248, 0.18); }
:where(.ev-chm-filter-hit) { background: rgba(255, 213, 0, 0.45); color: inherit; border-radius: 2px; }
:where(html.ev-dark .ev-chm-filter-hit) { background: rgba(255, 213, 0, 0.3); }
:where(.ev-chm-results-empty) { opacity: 0.6; padding: 3px 4px; }
/* Hidden table of contents: a narrow strip with the Show button. */
:where(.ev-chm-strip) { display: none; flex: none; width: 22px; box-sizing: border-box; flex-direction: column;
	align-items: center; padding-top: 4px; border-right: 1px solid rgba(128, 128, 128, 0.35); }
:where(.ev-chm-strip .ev-chm-btn) { width: 20px; }
:where(html.ev-chm-toc-closed .ev-chm-side), :where(html.ev-chm-toc-closed .ev-chm-splitter) { display: none; }
:where(html.ev-chm-toc-closed .ev-chm-strip) { display: flex; }
:where(.ev-chm-toc-item) { display: block; padding: 2px 0 2px calc(var(--ev-level, 0) * 14px);
	color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:where(a.ev-chm-toc-item:hover) { text-decoration: underline; }
:where(.ev-chm-toc-folder) { opacity: 0.75; }
:where(.ev-chm-main) { flex: 1; position: relative; display: flex; }
:where(.ev-chm-frame) { flex: 1; height: 100%; border: 0; background: #fff; }
/* No table of contents in the CHM: no left pane. */
:where(html.ev-chm-no-toc .ev-chm-side), :where(html.ev-chm-no-toc .ev-chm-strip),
:where(html.ev-chm-no-toc .ev-chm-splitter) { display: none; }
/* Border between the contents and the page: drag to resize, double click
   to return to the stylesheet width. */
:where(.ev-chm-splitter) { flex: none; width: 6px; margin-left: -3px; margin-right: -3px; z-index: 5; cursor: col-resize; }
:where(.ev-chm-splitter:hover), :where(html.ev-chm-resizing .ev-chm-splitter) { background: rgba(128, 128, 128, 0.3); }
:where(html.ev-chm-resizing), :where(html.ev-chm-resizing *) { cursor: col-resize; user-select: none; }
:where(html.ev-chm-resizing .ev-chm-frame) { pointer-events: none; }
/* The entry of the page shown on the right. */
:where(.ev-chm-toc-current) { background: rgba(11, 87, 208, 0.12); border-radius: 3px; }
:where(html.ev-dark .ev-chm-toc-current) { background: rgba(138, 180, 248, 0.18); }
/* The browser's own error page in a frame is light only; in the dark theme
   invert it while it is shown (dark grey page, light icon). */
:where(html.ev-dark .ev-chm-frame-error) { filter: invert(1) hue-rotate(180deg); }
/* Message for a page that failed to load. Same look and class names as the
   Markdown/RST message (navigation.js), plus .ev-nav-error-back and
   .ev-nav-error-reason (second line). No close button: Back returns to the
   last help page. */
:where(.ev-nav-error) { position: absolute; top: 16px; left: 0; right: 0; z-index: 10;
	width: fit-content; max-width: calc(100% - 32px); margin: 0 auto;
	display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px;
	border: 1px solid #d4a72c; border-radius: 6px; background: #fff8c5; color: #1f2328;
	font: 14px/1.4 sans-serif; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
:where(html.ev-dark .ev-nav-error) { border-color: #9e6a03; background: #3b2e0a; color: #f0f6fc; }
:where(.ev-nav-error-text) { overflow-wrap: anywhere; }
:where(.ev-nav-error-reason) { display: block; }
:where(.ev-nav-error-back) { flex: none; height: 28px; padding: 0 10px; border: 1px solid rgba(128, 128, 128, 0.5);
	border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
:where(.ev-nav-error-back:hover) { background: rgba(128, 128, 128, 0.2); }
</style>
<style id="ev-chm-css">__CHM_CSS__</style>
</head>
<body>
<nav id="ev-chm-side" class="ev-chm-side">
<div class="ev-chm-toolbar">
<button type="button" tabindex="-1" class="ev-chm-btn ev-chm-btn-home" title="Home" aria-label="Home"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg></button>
<button type="button" tabindex="-1" class="ev-chm-btn ev-chm-btn-back" title="Back" aria-label="Back" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 4 3.5 8l4 4"/></svg></button>
<button type="button" tabindex="-1" class="ev-chm-btn ev-chm-btn-forward" title="Forward" aria-label="Forward" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9.5M8.5 4l4 4-4 4"/></svg></button>
<button type="button" tabindex="-1" class="ev-chm-btn ev-chm-btn-collapse" title="Hide contents (Alt+T)" aria-label="Hide contents"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.5 4 4.5 8l4 4M12.5 4l-4 4 4 4"/></svg></button>
</div>
<div class="ev-chm-filter"><input type="search" class="ev-chm-filter-input" tabindex="-1" placeholder=" " aria-label="Filter contents" title="Filter contents (Alt+F)" spellcheck="false" autocomplete="off"><span class="ev-chm-filter-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.5 3h11l-4.3 5.2v4.3l-2.4 1.3V8.2z"/></svg></span></div>
<div id="ev-chm-toc" class="ev-chm-toc"></div>
<div class="ev-chm-results" role="listbox" aria-label="Matches"></div>
</nav>
<div class="ev-chm-splitter" title="Drag to resize; double click: default width"></div>
<div class="ev-chm-strip"><button type="button" tabindex="-1" class="ev-chm-btn ev-chm-btn-expand" title="Show contents (Alt+T)" aria-label="Show contents"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.5 4l4 4-4 4M3.5 4l4 4-4 4"/></svg></button></div>
<div id="ev-chm-main" class="ev-chm-main"><iframe id="ev-chm-frame" class="ev-chm-frame" name="ev-chm-frame"></iframe></div>
<script>
(function () {
	'use strict';
	var START = "__CHM_START__";
	var HOME = "__CHM_HOME__";
	var TOC = "__CHM_TOC__";
	var CODEPAGE = "__CHM_CODEPAGE__";
	var DARK = "__CHM_DARK__" === "1";
	var NAV_CLOSED = "__CHM_NAVCLOSED__" === "1";
	if (DARK) document.documentElement.classList.add('ev-dark');
	var USER_CSS = document.getElementById('ev-chm-css').textContent;
	var ARCHIVE_ROOT = new URL('/', location.href).href;

	var side = document.getElementById('ev-chm-side');
	var tocBox = document.getElementById('ev-chm-toc');
	var frame = document.getElementById('ev-chm-frame');
	var main = document.getElementById('ev-chm-main');
	var filterInput = document.querySelector('.ev-chm-filter-input');
	var resultsBox = document.querySelector('.ev-chm-results');
	var btnHome = document.querySelector('.ev-chm-btn-home');
	var btnBack = document.querySelector('.ev-chm-btn-back');
	var btnFwd = document.querySelector('.ev-chm-btn-forward');
	var noToc = false;

	// Search (F7, Ctrl+F) and print act on the help page.
	window.find = function () {
		try {
			var w = frame.contentWindow;
			return w.find.apply(w, arguments);
		} catch (e) {
			return false;
		}
	};
	window.print = function () {
		try { frame.contentWindow.print(); } catch (e) {}
	};

	// ---- Help page frame ----
	function frameForeign() {
		try { void frame.contentWindow.location.href; return false; } catch (e) { return true; }
	}
	// The frame's own history (Navigation API), without the files opened before.
	function frameNav() {
		try { return frame.contentWindow.navigation || null; } catch (e) { return null; }
	}
	// After a foreign page the frame may stay in another browser process whose
	// requests do not reach the evh:// handler (help pages lost their CSS).
	// A new frame element does not have this problem. The focus was in the
	// old frame: give it to the new one when it has loaded.
	var refocus = false;
	function rebuildFrame(url) {
		refocus = refocus || document.hasFocus() || document.activeElement === frame;
		var nf = document.createElement('iframe');
		nf.id = 'ev-chm-frame';
		nf.className = 'ev-chm-frame';
		nf.name = 'ev-chm-frame';
		nf.addEventListener('load', onFrameLoad);
		frame.replaceWith(nf);
		frame = nf;
		nf.src = url;
		updateNavButtons();
	}
	function openInFrame(url) {
		hideError();
		if (frameForeign()) rebuildFrame(url);
		else frame.contentWindow.location.href = url;
	}

	// Help pages get the classes ev-chm-topic (and ev-dark) and the [CHM]
	// stylesheet.
	function styleTopic(doc) {
		var root = doc.documentElement;
		if (!root) return;
		root.classList.add('ev-chm-topic');
		if (DARK) root.classList.add('ev-dark');
		if (USER_CSS && !doc.getElementById('ev-chm-css')) {
			var st = doc.createElement('style');
			st.id = 'ev-chm-css';
			st.textContent = USER_CSS;
			(doc.head || root).appendChild(st);
		}
	}
	var lastTopic = '';
	function onFrameLoad() {
		if (frameForeign()) { updateNavButtons(); return; }
		lastTopic = frame.contentWindow.location.href;
		hideError();
		frame.classList.remove('ev-chm-frame-error');
		styleTopic(frame.contentDocument);
		frame.contentDocument.addEventListener('keydown', onPaneKey, true);
		var n = frameNav();
		if (n) n.addEventListener('currententrychange', function () { updateNavButtons(); markCurrent(); });
		markCurrent();
		updateNavButtons();
		focusTopic();
	}
	frame.addEventListener('load', onFrameLoad);
	if (START) frame.src = START;

	// Encoding menu: the plugin serves the pages with the new code page.
	window.__evChmReloadTopic = function () {
		if (frameForeign()) { if (lastTopic) rebuildFrame(lastTopic); }
		else frame.contentWindow.location.reload();
	};
	// A help page that asked for a new window (target="_blank").
	window.__evChmOpenInFrame = openInFrame;

	// ---- Message for a page that failed to load ----
	function hideError() {
		var box = main.querySelector('.ev-nav-error');
		if (box) box.remove();
	}
	function goBack() {
		hideError();
		if (!lastTopic) return;
		if (frameForeign()) rebuildFrame(lastTopic);
		else frame.contentWindow.location.replace(lastTopic);
	}
	// reason: "blocked" ([WebView] OfflineMode), "offline" (network), "error".
	window.__evChmFrameFailed = function (uri, reason) {
		// mailto:, tel: and similar links go to other apps: not an error.
		if (uri && !/^(https?|evh):/i.test(uri)) return;
		hideError();
		var name = uri;
		var inArchive = uri.indexOf(ARCHIVE_ROOT) === 0;
		if (inArchive) {
			name = uri.substring(ARCHIVE_ROOT.length);
			try { name = decodeURIComponent(name); } catch (e) {}
		}
		var text = (inArchive ? 'Cannot open page: ' : 'Cannot open: ') + (name || '(unknown)');
		var why = reason === 'blocked' ? 'External links are blocked: [WebView] OfflineMode=1.' :
			reason === 'offline' ? 'No internet connection.' : '';
		frame.classList.add('ev-chm-frame-error');

		var box = document.createElement('div');
		box.className = 'ev-nav-error';
		box.setAttribute('role', 'alert');
		if (lastTopic) {
			var back = document.createElement('button');
			back.type = 'button';
			back.className = 'ev-nav-error-back';
			back.textContent = '← Back';
			back.addEventListener('click', goBack);
			box.appendChild(back);
		}
		var span = document.createElement('span');
		span.className = 'ev-nav-error-text';
		span.textContent = text;
		if (why) {
			var line2 = document.createElement('span');
			line2.className = 'ev-nav-error-reason';
			line2.textContent = why;
			span.appendChild(line2);
		}
		box.appendChild(span);
		main.appendChild(box);
		updateNavButtons();
	};
	window.__evChmFrameOk = function () {
		frame.classList.remove('ev-chm-frame-error');
		hideError();
		updateNavButtons();
	};

	// ---- Keyboard focus ----
	// The focus belongs to the help page unless it is in the left pane. Set
	// every time the view gets the focus: WebView2 may put it back on this
	// page after the first help page has loaded. Never taken from Total
	// Commander (only while the view has the focus).
	function inLeftPane() {
		var a = document.activeElement;
		return !!a && a !== document.body && a !== frame && side.contains(a);
	}
	function focusTopic() {
		if (refocus) {
			refocus = false;
			if (!inLeftPane()) { try { frame.contentWindow.focus(); } catch (e) {} }
			return;
		}
		if (!document.hasFocus()) return;
		if (inLeftPane() && !noToc && tocOpen()) return;
		try { frame.contentWindow.focus(); } catch (e) {}
	}
	window.addEventListener('focus', function () { setTimeout(focusTopic, 0); });

	// Scroll first, then focus: the entry's tooltip shows where the entry is
	// at the time of the focus.
	function focusLink(a) {
		a.scrollIntoView({ block: 'nearest' });
		a.focus({ preventScroll: true });
	}
	function focusContents() {
		if (document.documentElement.classList.contains('ev-chm-filtering')) { filterInput.focus(); return; }
		var a = tocBox.querySelector('a.ev-chm-toc-current') || tocBox.querySelector('a.ev-chm-toc-item');
		if (a) focusLink(a); else filterInput.focus();
	}
	// Ctrl+Tab, F6 (and with Shift): the contents <-> the help page. The
	// plugin calls this when WebView2 reports the key; otherwise onPaneKey.
	function switchPane() {
		if (noToc || !tocOpen()) return;
		if (inLeftPane()) { try { frame.contentWindow.focus(); } catch (e) {} }
		else focusContents();
	}
	window.__evChmSwitchPane = switchPane;
	function onPaneKey(e) {
		var ctrlTab = e.key === 'Tab' && e.ctrlKey && !e.altKey && !e.metaKey;
		var f6 = e.key === 'F6' && !e.ctrlKey && !e.altKey && !e.metaKey;
		if (!ctrlTab && !f6) return;
		e.preventDefault();
		e.stopPropagation();
		switchPane();
	}
	document.addEventListener('keydown', onPaneKey, true);

	// Keys in the contents move the focus, Enter opens the entry. Up on the
	// first entry goes to the filter field. Down, PgDn and End keep one more
	// line visible below the entry (the link tooltip at the bottom left).
	var TOC_KEYS = { ArrowDown: 1, ArrowUp: 1, PageDown: 1, PageUp: 1, Home: 1, End: 1 };
	// The farthest entry in direction dir that fits in one visible page.
	function pageStep(links, i, dir) {
		var view = tocBox.clientHeight, cur = links[i].getBoundingClientRect(), j = i;
		for (var k = i + dir; k >= 0 && k < links.length; k += dir) {
			var r = links[k].getBoundingClientRect();
			if ((dir > 0 ? r.bottom - cur.top : cur.bottom - r.top) > view) break;
			j = k;
		}
		if (j === i) j = Math.max(0, Math.min(links.length - 1, i + dir));
		return j;
	}
	function focusLinkKeepBelow(links, j) {
		var below = links[j + 1];
		if (below) below.scrollIntoView({ block: 'nearest' });
		else tocBox.scrollTop = tocBox.scrollHeight;
		var t = tocBox.getBoundingClientRect(), r = links[j].getBoundingClientRect();
		if (r.top < t.top || r.bottom > t.bottom) links[j].scrollIntoView({ block: 'nearest' });
		links[j].focus({ preventScroll: true });
	}
	tocBox.addEventListener('keydown', function (e) {
		if (!TOC_KEYS[e.key] || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
		var links = Array.prototype.slice.call(tocBox.querySelectorAll('a.ev-chm-toc-item'));
		var i = links.indexOf(document.activeElement);
		if (i < 0) return;
		e.preventDefault();
		switch (e.key) {
			case 'ArrowDown': if (i + 1 < links.length) focusLinkKeepBelow(links, i + 1); break;
			case 'ArrowUp': if (i > 0) focusLink(links[i - 1]); else filterInput.focus(); break;
			case 'PageDown': focusLinkKeepBelow(links, Math.min(links.length - 1, Math.max(i + 1, pageStep(links, i, 1) - 1))); break;
			case 'PageUp': focusLink(links[pageStep(links, i, -1)]); break;
			case 'Home': focusLink(links[0]); break;
			case 'End': focusLinkKeepBelow(links, links.length - 1); break;
		}
	});

	// ---- The entry of the current page ----
	function normUrl(u) {
		try { u = decodeURIComponent(u); } catch (e) {}
		return u.toLowerCase(); // CHM paths are case-insensitive
	}
	function markCurrent() {
		if (frameForeign()) return;
		var full = normUrl(frame.contentWindow.location.href), page = full.split('#')[0], exact = null, same = null;
		var items = tocBox.querySelectorAll('a.ev-chm-toc-item');
		for (var i = 0; i < items.length; i++) {
			var h = normUrl(items[i].href);
			if (h === full) { exact = items[i]; break; }
			if (!same && h.split('#')[0] === page) same = items[i];
		}
		var cur = exact || same;
		var prev = tocBox.querySelector('.ev-chm-toc-current');
		if (prev === cur) return;
		if (prev) { prev.classList.remove('ev-chm-toc-current'); prev.removeAttribute('aria-current'); }
		if (!cur) return;
		cur.classList.add('ev-chm-toc-current');
		cur.setAttribute('aria-current', 'page');
		cur.scrollIntoView({ block: 'nearest' });
	}

	// ---- Buttons: Home, Back, Forward ----
	function updateNavButtons() {
		var n = frameNav();
		btnBack.disabled = !(n ? n.canGoBack : (frameForeign() && !!lastTopic));
		btnFwd.disabled = !(n && n.canGoForward);
	}
	btnBack.addEventListener('click', function () {
		var n = frameNav();
		if (n && n.canGoBack) n.back(); else goBack();
	});
	btnFwd.addEventListener('click', function () {
		var n = frameNav();
		if (n && n.canGoForward) n.forward();
	});
	btnHome.addEventListener('click', function () {
		openInFrame(new URL(HOME || START, location.href).href);
	});
	// Contents links open in the frame by name (target); after a foreign page
	// they need a new frame (rebuildFrame).
	tocBox.addEventListener('click', function (e) {
		var a = e.target.closest('a.ev-chm-toc-item');
		if (!a || e.button !== 0 || e.ctrlKey || e.shiftKey || e.altKey || e.metaKey) return;
		if (!frameForeign()) return;
		e.preventDefault();
		openInFrame(a.href);
	});

	// ---- Show / hide the contents (buttons, Alt+T) ----
	// Start: the reader's last choice, else the CHM's (/#WINDOWS). A view
	// narrower than NARROW_PX (Quick View) starts hidden; a toggle there is
	// for this view only.
	var NARROW_PX = 500;
	var pref = !NAV_CLOSED;
	try {
		var saved = window.localStorage.getItem('ev-chm-toc');
		if (saved === 'open' || saved === 'closed') pref = saved === 'open';
	} catch (e) {}
	var manual = null;
	function narrow() { return window.innerWidth < NARROW_PX; }
	function tocOpen() { return manual !== null ? manual : (pref && !narrow()); }
	function applyToc() {
		document.documentElement.classList.toggle('ev-chm-toc-closed', !tocOpen());
	}
	function toggleToc() {
		if (noToc) return;
		var open = !tocOpen();
		if (narrow()) manual = open;
		else {
			manual = null;
			pref = open;
			try { window.localStorage.setItem('ev-chm-toc', open ? 'open' : 'closed'); } catch (e) {}
		}
		applyToc();
		focusTopic();
	}
	// Called by the plugin: Alt+T, Alt+F, Esc.
	window.__evChmToggleToc = toggleToc;
	window.__evChmFocusFilter = function () {
		if (noToc) return;
		if (!tocOpen()) { manual = true; applyToc(); }
		filterInput.focus();
		filterInput.select();
	};
	// true: Esc cleared the filter; false: Esc goes on to Total Commander.
	window.__evChmEscape = function () {
		if (document.activeElement !== filterInput || !filterInput.value) return false;
		filterInput.value = '';
		applyFilter();
		return true;
	};
	document.querySelector('.ev-chm-btn-collapse').addEventListener('click', toggleToc);
	document.querySelector('.ev-chm-btn-expand').addEventListener('click', toggleToc);
	// A click on a button keeps the focus where it is.
	Array.prototype.forEach.call(document.querySelectorAll('.ev-chm-btn'), function (b) {
		b.addEventListener('mousedown', function (e) { e.preventDefault(); });
	});
	window.addEventListener('resize', applyToc);

	// ---- Width of the contents (remembered for all CHMs) ----
	var splitter = document.querySelector('.ev-chm-splitter');
	var dragging = false;
	function setSideWidth(px, save) {
		px = Math.round(Math.max(120, Math.min(px, window.innerWidth - 150)));
		side.style.width = px + 'px';
		if (save) try { window.localStorage.setItem('ev-chm-toc-width', String(px)); } catch (e) {}
	}
	try {
		var savedWidth = parseInt(window.localStorage.getItem('ev-chm-toc-width'), 10);
		if (savedWidth > 0) setSideWidth(savedWidth, false);
	} catch (e) {}
	splitter.addEventListener('mousedown', function (e) {
		if (e.button !== 0) return;
		e.preventDefault();
		dragging = true;
		document.documentElement.classList.add('ev-chm-resizing');
	});
	document.addEventListener('mousemove', function (e) {
		if (dragging) setSideWidth(e.clientX - side.getBoundingClientRect().left, false);
	});
	document.addEventListener('mouseup', function () {
		if (!dragging) return;
		dragging = false;
		document.documentElement.classList.remove('ev-chm-resizing');
		setSideWidth(side.getBoundingClientRect().width || parseInt(side.style.width, 10), true);
	});
	splitter.addEventListener('dblclick', function () {
		side.style.width = '';
		try { window.localStorage.removeItem('ev-chm-toc-width'); } catch (e) {}
	});

	applyToc();
	updateNavButtons();
	function hideToc() {
		noToc = true;
		document.documentElement.classList.add('ev-chm-no-toc');
		focusTopic();
	}

	// ---- Filter (fuzzy) ----
	var tocEntries = []; // { name, key, href, path } of entries with a page
	var MAX_RESULTS = 200;
	var activeIndex = -1;
	// Case-insensitive, "ё" = "е"; the length stays the same.
	function foldText(t) { return t.toLowerCase().replace(/ё/g, 'е'); }
	function isWordStart(text, i) { return i === 0 || /[\s\-_.,:;()\[\]\/\\]/.test(text.charAt(i - 1)); }
	// Score of one query word in a title, or -1: the letters in order, not
	// necessarily together. Together and from a word start rank higher.
	function wordScore(key, word, hits) {
		var at = key.indexOf(word);
		if (at >= 0) {
			for (var k = 0; k < word.length; k++) hits[at + k] = true;
			return 100 + word.length * 10 + (isWordStart(key, at) ? 50 : 0) + (at === 0 ? 20 : 0);
		}
		var score = 0, pos = -1, run = 0;
		for (var i = 0; i < word.length; i++) {
			var next = key.indexOf(word.charAt(i), pos + 1);
			if (next < 0) return -1;
			// prefer a word start close after it
			var ws = next;
			while (ws >= 0 && ws - next < 12 && !isWordStart(key, ws)) ws = key.indexOf(word.charAt(i), ws + 1);
			if (ws >= 0 && ws - next < 12) next = ws;
			run = (next === pos + 1) ? run + 1 : 0;
			score += 10 + (isWordStart(key, next) ? 15 : 0) + run * 8 - (pos >= 0 ? Math.min(next - pos - 1, 10) : 0);
			hits[next] = true;
			pos = next;
		}
		return score;
	}
	function matchEntry(entry, words) {
		var hits = {}, total = 0;
		for (var i = 0; i < words.length; i++) {
			var sc = wordScore(entry.key, words[i], hits);
			if (sc < 0) return null;
			total += sc;
		}
		return { entry: entry, score: total - entry.name.length / 20, hits: hits };
	}
	function renderName(name, hits) {
		var frag = document.createDocumentFragment(), buf = '', inHit = false;
		function flush() {
			if (!buf) return;
			if (inHit) { var mk = document.createElement('mark'); mk.className = 'ev-chm-filter-hit'; mk.textContent = buf; frag.appendChild(mk); }
			else frag.appendChild(document.createTextNode(buf));
			buf = '';
		}
		for (var i = 0; i < name.length; i++) {
			var h = !!hits[i];
			if (h !== inHit) { flush(); inHit = h; }
			buf += name.charAt(i);
		}
		flush();
		return frag;
	}
	function setActive(i) {
		var items = resultsBox.querySelectorAll('.ev-chm-result');
		if (activeIndex >= 0 && items[activeIndex]) {
			items[activeIndex].classList.remove('ev-chm-result-active');
			items[activeIndex].setAttribute('aria-selected', 'false');
		}
		activeIndex = items.length ? Math.max(0, Math.min(i, items.length - 1)) : -1;
		if (activeIndex >= 0) {
			items[activeIndex].classList.add('ev-chm-result-active');
			items[activeIndex].setAttribute('aria-selected', 'true');
			items[activeIndex].scrollIntoView({ block: 'nearest' });
		}
	}
	function applyFilter() {
		var words = foldText(filterInput.value).split(/\s+/).filter(Boolean);
		document.documentElement.classList.toggle('ev-chm-filtering', words.length > 0);
		resultsBox.textContent = '';
		activeIndex = -1;
		if (!words.length) return;
		var found = [];
		for (var i = 0; i < tocEntries.length; i++) {
			var r = matchEntry(tocEntries[i], words);
			if (r) found.push(r);
		}
		found.sort(function (a, b) { return b.score - a.score; });
		if (!found.length) {
			var none = document.createElement('div');
			none.className = 'ev-chm-results-empty';
			none.textContent = 'Nothing found';
			resultsBox.appendChild(none);
			return;
		}
		found.slice(0, MAX_RESULTS).forEach(function (r) {
			var a = document.createElement('a');
			a.className = 'ev-chm-result';
			a.href = r.entry.href;
			a.tabIndex = -1;
			a.setAttribute('role', 'option');
			a.title = r.entry.path ? r.entry.path + ' › ' + r.entry.name : r.entry.name;
			var nm = document.createElement('span');
			nm.className = 'ev-chm-result-name';
			nm.appendChild(renderName(r.entry.name, r.hits));
			a.appendChild(nm);
			if (r.entry.path) {
				var pt = document.createElement('span');
				pt.className = 'ev-chm-result-path';
				pt.textContent = r.entry.path;
				a.appendChild(pt);
			}
			resultsBox.appendChild(a);
		});
		setActive(0);
	}
	var filterTimer = 0;
	function flushFilter() {
		if (!filterTimer) return;
		clearTimeout(filterTimer);
		filterTimer = 0;
		applyFilter();
	}
	filterInput.addEventListener('input', function () {
		clearTimeout(filterTimer);
		filterTimer = setTimeout(function () { filterTimer = 0; applyFilter(); }, 60);
	});
	filterInput.addEventListener('keydown', function (e) {
		if (e.key === 'Tab') return; // Ctrl+Q: Tab goes to Total Commander
		// Letters and digits are text here, not Lister keys (1..8, Q).
		e.stopPropagation();
		if (e.key === 'ArrowDown' && !filterInput.value.trim()) {
			e.preventDefault();
			var first = tocBox.querySelector('a.ev-chm-toc-item');
			if (first) focusLink(first);
			return;
		}
		if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
			flushFilter();
			e.preventDefault();
			setActive(activeIndex + (e.key === 'ArrowDown' ? 1 : -1));
		} else if (e.key === 'Enter') {
			flushFilter();
			e.preventDefault();
			var items = resultsBox.querySelectorAll('.ev-chm-result');
			if (items[activeIndex]) openInFrame(items[activeIndex].href);
		}
	});
	resultsBox.addEventListener('click', function (e) {
		var a = e.target.closest('a.ev-chm-result');
		if (!a || e.button !== 0) return;
		e.preventDefault();
		setActive(Array.prototype.indexOf.call(resultsBox.querySelectorAll('.ev-chm-result'), a));
		openInFrame(a.href);
	});

	// ---- Table of contents (.hhc) ----
	if (!TOC) { hideToc(); return; }

	var xhr = new XMLHttpRequest();
	xhr.open('GET', TOC);
	xhr.responseType = 'arraybuffer';
	xhr.onload = function () {
		if (xhr.status !== 200) { hideToc(); return; }
		buildToc(decodeSitemap(new Uint8Array(xhr.response)));
	};
	xhr.onerror = hideToc;
	xhr.send();

	// As hh.exe: BOM, a charset declared in the file, valid UTF-8, the
	// language code page, windows-1252.
	function decodeSitemap(bytes) {
		function tryDecode(label, fatal) {
			try {
				return new TextDecoder(label, { fatal: !!fatal }).decode(bytes);
			} catch (e) {
				return null;
			}
		}
		if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return tryDecode('utf-8');
		if (bytes[0] === 0xFF && bytes[1] === 0xFE) return tryDecode('utf-16le');
		if (bytes[0] === 0xFE && bytes[1] === 0xFF) return tryDecode('utf-16be');
		var head = String.fromCharCode.apply(null, bytes.subarray(0, 2048));
		var m = /<meta\b[^>]*charset\s*=\s*["']?\s*([\w:.-]+)/i.exec(head);
		return (m && tryDecode(m[1].toLowerCase())) || tryDecode('utf-8', true) ||
			(CODEPAGE && tryDecode(CODEPAGE)) || tryDecode('windows-1252');
	}

	// Tolerant .hhc scan: <UL> nesting + <OBJECT type="text/sitemap"> with
	// <param name="Name"> / <param name="Local">. A flat list; the level is
	// --ev-level and data-level.
	function buildToc(text) {
		var re = /<(\/?)ul\b[^>]*>|<object\b[^>]*text\/sitemap[^>]*>([\s\S]*?)<\/object>/gi;
		var m, depth = 0, count = 0, stack = [];
		while ((m = re.exec(text))) {
			if (m[2] === undefined) {
				depth = Math.max(0, depth + (m[1] ? -1 : 1));
				continue;
			}
			var name = param(m[2], 'Name');
			if (!name) continue;
			var local = param(m[2], 'Local');
			var level = Math.max(0, depth - 1);
			var el = document.createElement(local ? 'a' : 'span');
			el.className = local ? 'ev-chm-toc-item' : 'ev-chm-toc-item ev-chm-toc-folder';
			el.textContent = name;
			el.title = name;
			el.dataset.level = level;
			el.style.setProperty('--ev-level', level);
			if (local) {
				el.href = toUrl(local);
				el.target = 'ev-chm-frame';
			}
			tocBox.appendChild(el);
			count++;
			stack.length = level;
			if (local) tocEntries.push({ name: name, key: foldText(name), href: el.href, path: stack.filter(Boolean).join(' › ') });
			stack[level] = name;
		}
		if (!count) hideToc();
		markCurrent();
	}

	function param(body, key) {
		var re = /<param\b([^>]*)>/gi, m;
		while ((m = re.exec(body))) {
			var n = /\bname\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(m[1]);
			if (!n || (n[1] || n[2] || n[3] || '').toLowerCase() !== key.toLowerCase()) continue;
			var v = /\bvalue\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i.exec(m[1]);
			if (!v) return '';
			return decodeValue(v[1] !== undefined ? v[1] : (v[2] !== undefined ? v[2] : v[3]));
		}
		return '';
	}

	// HTML Help Workshop writes non-ASCII text of an ANSI help file as
	// references to Latin-1 characters (&Iuml; = 0xCF = "П" in windows-1251);
	// hh.exe reads them as bytes of the language code page. Same here. Byte
	// 0xD0 is written as &Dstrok; (checked with HHW), &dstrok; is taken as 0xF0.
	var HHW_BYTES = { 'Dstrok': 0xD0, 'dstrok': 0xF0 };
	function decodeValue(v) {
		var out = '', bytes = [], last = 0, m;
		var re = /&(?:#[0-9]+|#x[0-9a-f]+|[a-z][a-z0-9]*);/gi;
		function flush() {
			if (!bytes.length) return;
			out += new TextDecoder(CODEPAGE).decode(new Uint8Array(bytes));
			bytes = [];
		}
		while ((m = re.exec(v))) {
			if (m.index > last) { flush(); out += v.substring(last, m.index); }
			var ch = entity(m[0]);
			var c = ch.length === 1 ? ch.charCodeAt(0) : 0;
			var named = m[0].slice(1, -1);
			if (CODEPAGE && Object.prototype.hasOwnProperty.call(HHW_BYTES, named)) c = HHW_BYTES[named];
			if (CODEPAGE && c >= 0x80 && c <= 0xFF) bytes.push(c);
			else { flush(); out += ch; }
			last = re.lastIndex;
		}
		flush();
		return out + v.substring(last);
	}
	function entity(ref) {
		var t = document.createElement('textarea');
		t.innerHTML = ref;
		return t.value;
	}

	// "dir\page.htm", "/dir/page.htm#x", "ms-its:file.chm::/dir/page.htm"
	// -> URL relative to the archive root.
	function toUrl(local) {
		var p = local.replace(/\\/g, '/');
		var i = p.indexOf('::/');
		if (i >= 0) p = p.substring(i + 3);
		p = p.replace(/^\/+/, '');
		var hash = '';
		var h = p.indexOf('#');
		if (h >= 0) { hash = p.substring(h); p = p.substring(0, h); }
		return encodeURI(p) + hash;
	}
})();
</script>
</body>
</html>
